services:
  - type: web
    name: vip-hosting-bot
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn render_app:app --workers 1 --threads 1 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PANEL_ENABLE
        value: "1"
      - key: HBI_DISABLE
        value: "1"
      - key: HOSTING_BOT_TOKEN
        sync: false
      - key: HOSTING_OWNER_ID
        value: "8799679469"
      - key: HOSTING_WEBHOOK_SECRET
        generateValue: true